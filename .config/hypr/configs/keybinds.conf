###################
###  KEYBINDS   ###
###################

$mainMod = SUPER
$terminal = app2unit -- foot
$fileManager = app2unit -- dolphin
$browser = app2unit -- zen-browser
$volumecontrol = app2unit -- foot -T pulsemixer pulsemixer
$ocr = bash -c 'grim -g "$(slurp)" - | tesseract -l eng - stdout | wl-copy'
$menu = qs -c noctalia-shell ipc call launcher toggle
$altMenu = fuzzel

# Hyprland Specific
bind = $mainMod, Q, killactive,
bind = $mainMod_SHIFT, Q, killactive, 1
bind = $mainMod, W, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, i, togglesplit,
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, grave, togglespecialworkspace, term
bind = $mainMod SHIFT, grave, movetoworkspace, term
bind = $mainMod, F1, exec, ~/.config/hypr/scripts/util.sh toggle-anim
bind = SUPER_SHIFT, P, pin


# groups
bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, G, lockactivegroup, toggle
bind = $mainMod, tab, changegroupactive, f
bind = $mainMod SHIFT, tab, changegroupactive, b
bind = $mainMod CTRL, H, moveintogroup, l
bind = $mainMod CTRL, L, moveintogroup, r
bind = $mainMod CTRL, K, moveintogroup, u
bind = $mainMod CTRL, J, moveintogroup, d
bind = $mainMod, D, moveoutofgroup

# monocle layout
# bind = $mainMod, TAB, layoutmsg, cyclenext
# bind = $mainMod_SHIFT, TAB, layoutmsg, cycleprev

# Launch Defaults
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = ALT, Space, exec, $menu
bind = $mainMod, R, exec, $altMenu
bind = $mainMod, Z, exec, $browser
bind = $mainMod, O, exec, qs -c noctalia-shell ipc call lockScreen lock
bind = $mainMod, A, exec, $volumecontrol

# Tools
bind = $mainMod, C, exec, hyprpicker -a

# Wall Changer
bind = $mainMod, Y, exec, qs -c noctalia-shell ipc call wallpaper toggle

# Screenshot
bind = , PRINT, exec, hyprshot -z -m region -o /home/$USER/Pictures/Screenshots # Regular screenshot

# ocr
bind = $mainMod_SHIFT, T, exec, $ocr

# Clipboard Managers
bind = $mainMod, V, exec, qs -c noctalia-shell ipc call launcher clipboard
bind = $mainMod_SHIFT, V, exec, cliphist wipe # Wipe clipboard

# Rofi
bind = $mainMod, PERIOD, exec, qs -c noctalia-shell ipc call launcher emoji
bind = ALT, F4, exec, qs -c noctalia-shell ipc call sessionMenu toggle

# Hide / Show Bar
bind = $mainMod_SHIFT, W, exec, qs -c noctalia-shell ipc call bar toggle


###########
# DWINDLE #
###########

bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d

# Grow/shrink windows (resize)
binde = $mainMod_ALT, left, resizeactive,-70 0
binde = $mainMod_ALT, right, resizeactive,70 0
binde = $mainMod_ALT, up, resizeactive,0 -70
binde = $mainMod_ALT, down, resizeactive,0 70

bind = $mainMod_SHIFT, up, movewindow, u
bind = $mainMod_SHIFT, right, movewindow, r
bind = $mainMod_SHIFT, left, movewindow, l
bind = $mainMod_SHIFT, down, movewindow, d

# Grow/shrink window sizes with VIM keybinds

binde = $mainMod_ALT, h, resizeactive,-70 0
binde = $mainMod_ALT, l, resizeactive,70 0
binde = $mainMod_ALT, k, resizeactive,0 -70
binde = $mainMod_ALT, j, resizeactive,0 70

bind = $mainMod_SHIFT, k, movewindow, u
bind = $mainMod_SHIFT, l, movewindow, r
bind = $mainMod_SHIFT, h, movewindow, l
bind = $mainMod_SHIFT, j, movewindow, d

bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

