# regular autostarts
exec-once = [workspace 1 silent] $browser
# exec-once = easyeffects --gapplication-service

exec-once = [workspace special:term silent; fullscreen] foot

env = HYPRCURSOR_THEME,"MacOS-Tahoe-Cursor"
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,"MacOS-Tahoe-Cursor"
env = XCURSOR_SIZE,24
exec-once = hyprctl setcursor "MacOS-Tahoe-Cursor" 24

input {
    kb_layout = us,tr
    kb_options = caps:escape,grp:win_space_toggle
    accel_profile = flat
    repeat_delay = 250
    follow_mouse = 1
    sensitivity = 0.2 # -1.0 - 1.0, 0 means no modification.
}

animations {
    enabled = false
}

decoration {
    shadow {
      enabled = true
    }
    blur {
      enabled = false
    }
}
