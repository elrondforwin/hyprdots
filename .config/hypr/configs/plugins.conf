plugin {
    csgo-vulkan-fix {
        res_w = 1440
        res_h = 1080

        # NOT a regex! This is a string and has to exactly match initial_class
        class = cs2

        # Whether to fix the mouse position. A select few apps might be wonky with this. fix_mouse = true
    }

    hyprbars {
        # example config
        bar_height = 16

        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        # hyprbars-button = rgb(ffffff), 12, , hyprctl dispatch killactive
        # hyprbars-button = rgb(eeee11), 12, , hyprctl dispatch fullscreen 1

        # cmd to run on double click of the bar
        on_double_click = hyprctl dispatch fullscreen 1

        bar_text_font = JetBrainsMono NF Bold
        bar_color = $surface_lowest
        col.text = $primary
        bar_padding = 8
        bar_button_padding = 8
        bar_part_of_window = false
        bar_precedence_over_border = false
        icon_on_hover = true
        bar_text_size = 10
        bar_text_align = center
        bar_buttons_alignment = right
    }

    hyprglass {
        enabled = 0
        default_theme = dark
        default_preset = default

        brightness = 0.9                 # global override
        dark:brightness = 0.5           # built-in dark theme override
        light:adaptive_boost = 0.5       # built-in light theme override

        layers {
          enabled = 0
        }

        # Custom preset: shared + per-theme variants
        # preset = name:clear, glass_opacity:0.9, blur_strength:1.5
        # preset = name:clear:dark, brightness:0.7
        # preset = name:clear:light, brightness:1.2
    }
}
