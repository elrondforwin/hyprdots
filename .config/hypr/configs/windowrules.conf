#####################
###  WINDOW RULES ###
#####################

# Allow tearing
windowrule {
  name = allowtearing
  opaque = on
  match:class = ^(cs2)$
}

windowrule {
  name = floatfixes
  float = on
  match:title = ^(?i)Rename .*
}

windowrule {
  name = floatfixes
  float = on
  match:title = ^File (Operation|Upload)( Progress)?$
}

windowrule {
  name = floatfixes
  float = on
  match:title = ^Friends List$
  match:class = ^(steam)$
}

windowrule {
  name = floatfixes
  float = on
  match:title = ^Library$
}

windowrule {
  name = floatfixes
  float = on
  match:title = ^Save As$
}

windowrule {
  name = floatfixes
  float = on
  match:title = ^GIMP Crash Debug$
}

windowrule {
  name = floatfixes
  float = on
  match:title = ^Export Image as PNG$
}

windowrule {
  name = floatfixes
  float = on
  match:title = ^(Select|Open)( a)? (File|Folder)(s)?$
}

windowrule {
  name = floatfixes
  float = on
  match:title = ^.* Properties$
}

# Fix focus issues
windowrule {
  name = initialfocus
  no_initial_focus = on
  match:class = ^(resolve)$
}

windowrule {
  name = ideafix
  no_initial_focus = on
  match:class = ^(jetbrains-idea-ce)$
}

# force tile
windowrule {
  name = forcetile
  tile = on
  match:class = ^(Aseprite)$
}

# no screen share
windowrule {
  name = noscreenshare
  no_screen_share = on
  match:class = ^(Bitwarden)$
}

# Prism Launcher popups
windowrule {
  name = prism-popups
  float = on
  size = 1100 650
  center = on
  match:title = ^(?i)Console window for.*
}

windowrule {
  name = pulsemixer
  float = on
  size = 1200 500
  center = on
  match:title = ^(pulsemixer)$
}

# File manager popups
windowrule {
  name = fm-popups
  float = on
  center = on
  size = 1100 650
  match:title = ^(?i)Open folder.*
}

# XDG desktop portal
windowrule {
  name = xdg-desktop-portal
  border_size = 0
  match:class = ^(Xdg-desktop-portal-gtk)$
}

# VLC (XWayland)
windowrule {
  name = windowrule-34
  rounding = 8
  match:xwayland = 1
  match:class = ^(vlc)$
}

# XWayland popups (e.g., Java apps)
windowrule {
  name = windowrule-35
  no_dim = on
  no_shadow = on
  rounding = 8
  match:xwayland = 1
  match:title = ^win[0-9]+$
}

# Center all native floating windows (not XWayland)
windowrule {
  name = windowrule-36
  center = on
  match:float = 1
  match:xwayland = 0
}

# Ensure fullscreen windows are fully opaque
windowrule {
  name = windowrule-38
  opacity = 1.0
  match:fullscreen = 1
}

# noctalia rule
layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.5
  blur = true
  blur_popups = true
}

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.5
  blur = true
  blur_popups = true
}

layerrule {
  name = selection
  match:namespace = selection
  animation = fade
}

layerrule {
  name = hyprpicker
  match:namespace = hyprpicker
  animation = fade
}

# f[1] window
windowrule {
  name = windowrule-37
  border_color = $tertiary
  match:workspace = f[1]
}

windowrule {
  name = zen-blur
  no_blur = off
  match:class = zen
}

windowrule {
  name = kitty-blur
  no_blur = off
  match:class = kitty
}
